[project]
name = "pricewars"
version = "0.1.0"
description = "Six AI models run competing tomato stalls at the same farmers market."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    # langgraph/langchain-core/langchain-openai move fast and in lockstep — pin
    # floors close to what's actually tested here, not just "some 0.x range",
    # after an early mismatch (langgraph 1.0.10 required langchain-core internals
    # that 1.1.3 didn't have yet) broke imports outright.
    "langgraph>=1.2",
    "langchain-core>=1.5",
    "langchain-openai>=1.5",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pricewars*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
